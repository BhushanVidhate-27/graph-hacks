# deploy/docker-compose.yml — one-command local setup. Bhushan owns deploy/.
#
# `docker compose up` gives a COMPLETE working setup on a clean machine with only
# Docker and Python. This is the mandatory Rule 10 fallback if the live deploy
# fails, and it is what ships instead of a broken URL, so it MUST work.
#
#   cp .env.example .env      # add ANTHROPIC_API_KEY
#   docker compose up --build
#   open http://localhost:8080
#
# The `seed` service generates the CSVs and loads them into FalkorDB, so the
# graph is populated without a single manual command. The api waits for seed to
# finish, so you never hit a live server pointing at an empty graph — which
# reads as "every answer is wrong" rather than "not ready yet".

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: helio-falkordb
    ports:
      - "6379:6379"   # FalkorDB
      - "3000:3000"   # FalkorDB Browser — open http://localhost:3000
    healthcheck:
      # Cypher, not just TCP: the port accepts connections before the graph
      # engine is actually answering queries.
      test: ["CMD-SHELL", "redis-cli GRAPH.QUERY g 'RETURN 1 AS ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot. Generates data/ then loads it, then exits. Not a long-running
  # service — `docker compose up` runs it to completion and the api waits.
  seed:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: helio-seed
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
      FALKORDB_SSL: "false"
      FALKORDB_GRAPH: helio
    command: >
      sh -c "python scripts/generate.py && python scripts/load.py"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: helio-api
    ports:
      - "8080:8080"
    depends_on:
      falkordb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      # Override .env so the container talks to the compose service by name,
      # not to whatever host the developer happens to have in their .env.
      # Username and password MUST be blanked explicitly: env_file loads the
      # developer's .env, and a developer who also points at FalkorDB Cloud will
      # otherwise send Cloud credentials to the local no-auth instance and get
      # "invalid username-password pair" on every query.
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
      FALKORDB_SSL: "false"
      FALKORDB_GRAPH: helio
      # Frontend and API are served from the SAME origin here, so CORS never
      # applies. Do not set USE_MOCK=1 — that answers from a JSON fixture and
      # never touches the graph, which looks identical to working.
      USE_MOCK: "0"
    restart: unless-stopped
